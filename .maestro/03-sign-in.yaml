# Signing in reaches the backend and leaves the auth stack.
appId: ${APP_ID}
name: Sign in
---
- launchApp:
    clearState: true
- tapOn: "Username"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
# A fresh account has no pet yet, so the app asks for one; an account that
# already has a pet lands on the diary.
- extendedWaitUntil:
    visible:
      text: "Create profile|Diary"
    timeout: 20000
