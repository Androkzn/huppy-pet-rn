# The diary shows the day's sections and can log an activity.
appId: com.huppy.pet
name: Diary
---
- runFlow: shared/ensure-pet.yaml
- assertVisible: "Diary"
- assertVisible: "Nutrition"
- assertVisible: "Meals"
- assertVisible: "Activities"

# Nutrition collapses and reopens.
- tapOn: "Nutrition"
- tapOn: "Nutrition"

# Log a walk from the activities section.
- tapOn:
    text: "Add to Activities|Add activity"
- assertVisible: "Add activity"
- assertVisible: "Activity"
- assertVisible: "Measured in"
- tapOn: "Add"
- assertVisible: "Diary"
