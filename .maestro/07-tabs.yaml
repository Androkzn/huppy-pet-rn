# Every tab opens its screen.
appId: com.huppy.pet
name: Tabs
---
- runFlow: shared/ensure-pet.yaml
- tapOn: "Dashboard"
- assertVisible: "Dashboard"
- assertVisible: "Range"
- tapOn: "Training"
- assertVisible: "Training"
- assertVisible: "Sessions"
- tapOn: "More"
- assertVisible: "More"
- assertVisible: "Sign out"
- tapOn: "Diary"
- assertVisible: "Diary"
