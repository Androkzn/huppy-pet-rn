# Food can be searched for and added to the day's meal.
appId: com.huppy.pet
name: Add food
---
- runFlow: shared/ensure-pet.yaml
- assertVisible: "Diary"
- tapOn:
    text: "Add food"
- assertVisible: "Add food"
- assertVisible: "Search food"
- tapOn: "Search food"
- inputText: "chicken"
- hideKeyboard
- back
- assertVisible: "Diary"
