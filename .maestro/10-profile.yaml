# The profile screen opens from More and shows the pet's details.
appId: com.huppy.pet
name: Profile
---
- runFlow: shared/ensure-pet.yaml
- tapOn: "More"
- assertVisible: "Profile"
- tapOn: ${PET_NAME}
- assertVisible: "Name"
- assertVisible: "Breed"
- assertVisible: "Weight, kg"
- assertVisible: "Food ratio"
- back
- assertVisible: "More"
