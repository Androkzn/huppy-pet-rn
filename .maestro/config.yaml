# Maestro suite configuration.
#
# Flows run in file order and share one account, so the suite exercises a single
# signed-in user rather than leaving a trail of new ones behind. `appId` is set
# per flow: Maestro resolves it before these values are substituted.
flows:
  - "*.yaml"

env:
  E2E_EMAIL: maestro-e2e@huppy.test
  E2E_PASSWORD: "Huppy!e2e2026"
  PET_NAME: Maestro
