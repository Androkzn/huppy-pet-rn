# Ensures the signed-in account has a pet, creating one if the diary asks.
appId: com.huppy.pet
---
- runFlow: ensure-signed-in.yaml
- runFlow:
    when:
      visible: "Add your pet"
    commands:
      - tapOn: "Add pet"
      - assertVisible: "New pet"
      # The placeholder addresses the input; "Name" is only the row's title.
      - tapOn: "Enter name"
      - waitForAnimationToEnd
      - inputText: ${PET_NAME}
      - assertVisible: ${PET_NAME}
      - hideKeyboard
      # The save button sits below the fold on this form; see 05-create-profile.
      - scrollUntilVisible:
          element:
            text: "Save profile"
          direction: DOWN
          timeout: 20000
      - tapOn: "Save profile"
      - extendedWaitUntil:
          visible: "Nutrition"
          timeout: 30000
