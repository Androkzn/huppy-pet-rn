<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Website for pet owners who feed their companions raw diet"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>Huppy</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #E9E4D7 !important;
        overflow-x: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: #E9E4D7 !important;
        display: flex;
        flex-direction: column;
      }
      /* React Native Web flexbox support */
      [data-reactroot] {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
      }
      /* Ensure React Native components are visible */
      div[style*="flex"] {
        display: flex !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
